<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logesh E – Developer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#55627d; --line:#d3d9e6;
  --accent:#2b4bff; --accent-ink:#ffffff; --l0:#dde3ef; --l1:#b9c6ff; --l2:#7f95ff; --l3:#2b4bff;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#161e33; --ink:#e8ecf8; --muted:#9aa6c4; --line:#27314d;
    --accent:#8ea0ff; --accent-ink:#0e1424; --l0:#1d2740; --l1:#2c3d7a; --l2:#566cd6; --l3:#8ea0ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e33; --ink:#e8ecf8; --muted:#9aa6c4; --line:#27314d;
  --accent:#8ea0ff; --accent-ink:#0e1424; --l0:#1d2740; --l1:#2c3d7a; --l2:#566cd6; --l3:#8ea0ff;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 Figtree,system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.5rem}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.05;margin:0}
.hero-grid{display:grid;grid-template-columns:1fr 280px;gap:3rem;align-items:center}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;box-shadow:10px 10px 0 var(--accent);background:var(--l0)}
header.hero{padding:5rem 0 3rem}
h1{font-size:clamp(2.75rem,9vw,6rem);font-weight:700;letter-spacing:-.03em}
.role{font-size:1.25rem;color:var(--muted);max-width:34rem;margin:1.25rem 0 2rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-2px)}
.btn{transition:transform .15s}
.grid-wrap{margin-top:3rem;overflow-x:auto;padding-bottom:.5rem}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;width:max-content}
.heat i{display:block;border-radius:3px;background:var(--l0)}
.heat i.on{animation:fill .5s both}
@keyframes fill{from{background:var(--l0)}}
section{padding:3.5rem 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.75rem,4vw,2.5rem);margin-bottom:1.75rem;letter-spacing:-.02em}
.cert{display:grid;grid-template-columns:1fr auto;gap:.5rem 1.5rem;padding:1.5rem 0;border-bottom:1px solid var(--line);align-items:start}
.cert:first-of-type{padding-top:0}
.cert h3{font-size:1.5rem}
.cert h3 a{text-decoration:none}
.cert h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.cert p{grid-column:1;margin:.25rem 0;color:var(--muted);max-width:38rem}
.stack{grid-column:2;grid-row:1/3;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end;max-width:14rem}
.stack span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.15rem .6rem;font-size:.9rem}
.more{margin-top:1.5rem}
.group{font-size:1.25rem;color:var(--muted);margin:2.5rem 0 1rem}
.group:first-of-type{margin-top:0}
.stack .score{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.count{color:var(--muted);margin:-1rem 0 2rem}
.about{display:grid;grid-template-columns:2fr 1fr;gap:2.5rem}
.about p{margin:0 0 1rem;max-width:36rem}
.skills{list-style:none;margin:0;padding:0}
.skills li{padding:.5rem 0;border-bottom:1px solid var(--line)}
footer{padding:3rem 0 4rem;border-top:1px solid var(--line);color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
@media (max-width:640px){
  header.hero{padding-top:3rem}
  .hero-grid{grid-template-columns:1fr;gap:2rem}
  .photo{max-width:240px;order:-1;margin-right:10px}
  .cert{grid-template-columns:1fr}
  .stack{grid-column:1;grid-row:auto;justify-content:flex-start;max-width:none;margin-top:.5rem}
  .about{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.heat i.on{animation:none}.btn{transition:none}}
</style>
</head>

  if (!groups.has(c.group)) groups.set(c.group, []);

});

groups.forEach((items, name) => {
  const gh3 = document.createElement("h3"); gh3.className = "group"; gh3.textContent = name;
  $("cert-list").appendChild(gh3);
  items.forEach(c => {
    total++;
    const d = document.createElement("article"); d.className = "cert";
    const h = document.createElement("h3"); h.textContent = c.title;
    const p = document.createElement("p"); p.textContent = c.by + ", " + c.date;
    const st = document.createElement("div"); st.className = "stack";
    (c.tags || []).forEach((t, i) => { const sp = document.createElement("span"); if (i === 0) sp.className = "score"; sp.textContent = t; st.appendChild(sp); });
    d.append(h, p, st);
    $("cert-list").appendChild(d);
  });
});
$("count").textContent = total + " completed courses and certifications";

/* Decorative contribution-style grid: a pattern, not real activity data. */
(function(){
  const heat = $("heat"); let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = 30, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (let c = 0; c < cols; c++) for (let r = 0; r < 7; r++) {
    const i = document.createElement("i");
    const v = rnd() * (0.4 + c / cols);
    const level = v > 1.05 ? 3 : v > 0.8 ? 2 : v > 0.5 ? 1 : 0;
    if (level) {
      i.className = "on"; i.style.background = "var(--l" + level + ")";
      if (!calm) i.style.animationDelay = (c * 45 + r * 12) + "ms";
    }
    heat.appendChild(i);
  }
})();
